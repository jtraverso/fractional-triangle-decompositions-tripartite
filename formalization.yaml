      lean: "ABLP2026.theorem_1_3"
      module: "ABLPChallenge"
      status: "proved"
    - source: "Lemma 2.1: no fractional K₃-decomposition iff a triangle-covered, totally negative weighting exists"
      lean: "ABLP2026.lemma_2_1"
      module: "ABLPChallenge"
      status: "proved"
    - source: "Proposition 3.1: perturbation to a triangle-covered, balanced, untied, nonzero weighting"
      lean: "ABLP2026.proposition_3_1"
      module: "ABLPChallenge"
      status: "proved"
    - source: "Corollary 3.5"
      lean: "ABLP2026.corollary_3_5"
      module: "ABLPChallenge"
      status: "proved"
    - source: "Proposition 4.2: a positive edge sends at most its weight"
      lean: "ABLP2026.proposition_4_2"
      module: "ABLPChallenge"
      status: "proved"
    - source: "Proposition 4.3: lower bound g_d(x, y) for the weight received by a negative edge"
      lean: "ABLP2026.proposition_4_3"
      module: "ABLPChallenge"
      status: "proved"
    - source: "Proposition 4.4: g_d ≥ 1 for the function f of (8) and d ≤ 0.231 + η"
      lean: "ABLP2026.proposition_4_4"
      module: "ABLPChallenge"
      status: "proved"

